name: Deploy website to GitHub Pages

env:
  WC_HUGO_VERSION: '0.135.0'

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Provide permission to clone the repo and deploy it to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build website
  build:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch history for Hugo's .GitInfo and .Lastmod
          fetch-depth: 0
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.WC_HUGO_VERSION }}
          extended: true
      - uses: actions/cache@v4
        with:
          path: /tmp/hugo_cache_runner/
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          echo "Hugo Cache Dir: $(hugo config | grep cachedir)"
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Verify News pages and photo
        run: |
          test -s public/news/index.html
          test -s public/news/professor-wei-wang-birthday-2026/index.html
          test -s public/images/news/wei-wang-birthday-2026.webp
          echo "News index, birthday article and photo verified."
      # Optimize copies in the generated site, never the original source photos.
      # This lowers Pages sync traffic without changing image URLs or animation code.
      - name: Set up image optimizer
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reduce Pages image payload
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import os

          site = Path("public")
          before = sum(p.stat().st_size for p in site.rglob("*") if p.is_file())
          saved = 0
          optimized = 0

          for src in site.rglob("*"):
              if not src.is_file() or src.suffix.lower() not in {".jpg", ".jpeg", ".png"}:
                  continue
              original = src.stat().st_size
              if original < 700_000:
                  continue
              dest = src.with_name(src.name + ".optimized" + src.suffix)
              try:
                  with Image.open(src) as raw:
                      image = ImageOps.exif_transpose(raw)
                      # Retain up to 2200 pixels of detail; never upscale.
                      image.thumbnail((2200, 2200), Image.Resampling.LANCZOS)
                      if src.suffix.lower() in {".jpg", ".jpeg"}:
                          if image.mode not in {"RGB", "L"}:
                              image = image.convert("RGB")
                          image.save(dest, "JPEG", quality=83, optimize=True,
                                     progressive=True)
                      else:
                          # Keep PNG alpha, format and URL unchanged.
                          image.save(dest, "PNG", optimize=True, compress_level=9)
                  after = dest.stat().st_size
                  if after < original * 0.98:
                      os.replace(dest, src)
                      saved += original - after
                      optimized += 1
                  else:
                      dest.unlink()
              except Exception as exc:
                  if dest.exists():
                      dest.unlink()
                  print(f"Image optimizer skipped {src}: {exc}")

          after = sum(p.stat().st_size for p in site.rglob("*") if p.is_file())
          print(f"Pages files: {before / 1048576:.1f} MiB -> "
                f"{after / 1048576:.1f} MiB; "
                f"optimized {optimized} images; saved {saved / 1048576:.1f} MiB.")
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deploy website to GitHub Pages hosting
  deploy:
    if: github.repository_owner != 'HugoBlox'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000 # Allow up to 20 minutes for delayed Pages file sync
