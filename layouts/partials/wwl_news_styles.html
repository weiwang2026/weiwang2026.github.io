<style>
/* Scoped Apple-inspired editorial news styling. */
.wwl-news{max-width:1060px;width:calc(100% - 44px);margin:0 auto;padding:clamp(32px,5vw,66px) 0 80px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#182645}
.wwl-news__heading{font-size:clamp(2rem,3.8vw,3.1rem);font-weight:720;letter-spacing:-.052em;line-height:1.12;margin:0 0 30px;color:#122343}
.wwl-news__list{border-top:1px solid rgba(26,45,83,.16)}
.wwl-news__link{display:grid;grid-template-columns:145px minmax(0,1fr) 22px;gap:24px;align-items:start;padding:24px 10px 23px 0;border-bottom:1px solid rgba(26,45,83,.13);color:inherit!important;text-decoration:none!important;transition:background .22s ease}
.wwl-news__link:hover,.wwl-news__link:focus-visible{background:rgba(98,82,171,.035)}
.wwl-news__date{font-size:.88rem;color:#74829a;font-weight:550;white-space:nowrap;padding-top:4px;letter-spacing:.005em}
.wwl-news__title{margin:0 0 7px;font-size:clamp(1.12rem,1.65vw,1.34rem);line-height:1.34;font-weight:650;letter-spacing:-.026em;color:#172953;transition:color .2s ease}
.wwl-news__link:hover .wwl-news__title,.wwl-news__link:focus-visible .wwl-news__title{color:#6530bf}
.wwl-news__excerpt{font-size:.92rem;line-height:1.57;color:#66758b;margin:0;font-weight:400;letter-spacing:-.004em}
.wwl-news__arrow{font-size:1.3rem;line-height:1.2;color:#9aa6ba;transition:transform .2s ease,color .2s ease;text-align:right;aria-hidden:true}
.wwl-news__link:hover .wwl-news__arrow{transform:translateX(4px);color:#6530bf}
.wwl-news__article{max-width:820px;margin:0 auto}
.wwl-news__back{display:inline-block;color:#5a4ba9!important;text-decoration:none!important;font-size:.91rem;font-weight:550;margin:0 0 38px}
.wwl-news__back:hover{text-decoration:underline!important}
.wwl-news__article-date{font-size:.88rem;color:#74829a;margin:0 0 15px}
.wwl-news__article-title{font-size:clamp(1.8rem,3.3vw,2.75rem);line-height:1.19;letter-spacing:-.045em;font-weight:720;color:#172953;margin:0 0 26px}
.wwl-news__article-body{font-size:clamp(1rem,1.25vw,1.08rem);line-height:1.85;color:#34445f}
.wwl-news__article-body p{margin:0 0 20px}
.wwl-news__article-body a{color:#6238ba;text-decoration:underline;text-underline-offset:3px}
.wwl-news__article-body strong{font-weight:650;color:#22375f}
@media(max-width:680px){.wwl-news{width:calc(100% - 36px);padding:32px 0 60px}.wwl-news__heading{margin-bottom:24px}.wwl-news__link{grid-template-columns:minmax(0,1fr) 20px;gap:8px;padding:21px 0}.wwl-news__date{grid-column:1/-1;padding:0;margin-bottom:2px;font-size:.82rem}.wwl-news__copy{grid-column:1;min-width:0}.wwl-news__arrow{grid-column:2;grid-row:2;align-self:center}.wwl-news__excerpt{font-size:.89rem}.wwl-news__back{margin-bottom:28px}}
@media(prefers-reduced-motion:reduce){.wwl-news__link,.wwl-news__title,.wwl-news__arrow{transition:none}}
</style>
