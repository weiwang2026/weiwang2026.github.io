<style>
/* Wang Group editorial news: compact, single-line Apple-inspired index. */
.wwl-news{max-width:1120px;width:calc(100% - 44px);margin:0 auto;padding:clamp(32px,5vw,66px) 0 80px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#182645}

.wwl-news__link{display:grid;grid-template-columns:100px minmax(0,1fr) 20px;gap:20px;align-items:center;padding:19px 9px 19px 0;border-bottom:1px solid rgba(26,45,83,.13);color:inherit!important;text-decoration:none!important;transition:background .2s ease}
.wwl-news__link:hover,.wwl-news__link:focus-visible{background:rgba(98,82,171,.035)}

.wwl-news__date{font-size:.83rem;line-height:1.35;color:#74829a;font-weight:550;white-space:nowrap;letter-spacing:.005em}

.wwl-news__link:hover .wwl-news__arrow{transform:translateX(3px);color:#6530bf}
.wwl-news__article{max-width:820px;margin:0 auto}
.wwl-news__back{display:inline-block;color:#5a4ba9!important;text-decoration:none!important;font-size:.91rem;font-weight:550;margin:0 0 38px}

@media(max-width:680px){

.wwl-news__date{font-size:.75rem}
.wwl-news__title{font-size:.86rem;letter-spacing:-.025em}

}

.wwl-news__hero{margin:0 0 32px}
